services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: billing_rtrwnet
      DB_USERNAME: billing
      DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      APP_TIMEZONE: Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy
  scheduler:
    build: .
    command: php artisan schedule:work
    environment: &app_env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: billing_rtrwnet
      DB_USERNAME: billing
      DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      APP_TIMEZONE: Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy
  queue:
    build: .
    command: php artisan queue:work --tries=3 --backoff=10
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: billing_rtrwnet
      MARIADB_USER: billing
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set a strong DB_ROOT_PASSWORD in .env}
    volumes: ["dbdata:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  dbdata:
