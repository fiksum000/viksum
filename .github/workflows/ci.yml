name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Laravel runtime files
        run: |
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          cp .env.example .env
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo, mysql, bcmath, zip, intl
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: php artisan key:generate
      - name: Validate route registration
        run: php artisan route:list --except-vendor >/dev/null
      - name: Compile Blade templates
        run: php artisan view:cache
      - run: php artisan test

